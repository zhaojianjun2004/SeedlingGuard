<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智能育苗室环境监测与告警</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#172232;background:#edf2f5}
    body{max-width:920px;margin:0 auto;padding:24px}
    h1{font-size:1.55rem;margin:0 0 8px}p{color:#506070}
    .panel{background:white;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 2px 12px #263c4d12}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
    .metric{padding:14px;border-radius:8px;background:#f2f6f8}
    .label{font-size:.85rem;color:#506070}.value{font-size:1.5rem;font-weight:650;margin-top:6px}
    .quality{font-size:.8rem;margin-top:4px}.VALID{color:#147d43}.STALE{color:#9b6300}.FAULT,.INVALID{color:#b42318}
    .online{color:#147d43}.offline{color:#b42318}
    button,input{font:inherit;padding:9px;border-radius:7px;border:1px solid #9baab5}
    button{background:#185bb5;color:white;border:0;cursor:pointer;margin:4px 5px 4px 0}
    button:disabled{background:#8294a4;cursor:not-allowed}
    input[type=number]{width:130px}input[type=password]{width:210px}
    .small{font-size:.85rem;color:#647586}#message{min-height:1.3em}
  </style>
</head>
<body>
  <h1>智能育苗室环境监测与告警</h1>
  <p>F407 负责现场采集，ESP32-S3 提供局域网状态。页面每 2 秒读取一次快照。</p>
  <section class="panel">
    <div id="connection">正在读取网关状态…</div>
    <div id="devices" class="small"></div>
    <div id="configuration" class="small"></div>
    <div id="counters" class="small"></div>
  </section>
  <section class="panel">
    <h2>现场测点</h2>
    <div id="points" class="grid"></div>
    <p class="small">失效或过期测点只显示质量状态，不把历史读数显示为实时值。</p>
  </section>
  <section id="wifi-panel" class="panel" hidden>
    <h2>Wi-Fi 配网</h2>
    <p class="small">当前处于配网 AP。提交路由器凭据后，网关会尝试 STA 连接；拿到 IP 才写入 NVS。</p>
    <label>SSID <input id="wifi-ssid" autocomplete="off"></label><br>
    <label>密码 <input id="wifi-password" type="password" autocomplete="off"></label><br>
    <button id="wifi-submit" type="button">连接路由器</button>
    <div id="wifi-message" role="status"></div>
  </section>
  <section class="panel">
    <h2>采集控制</h2>
    <p class="small">命令等待 F407 回执后才显示执行结果。令牌只在此页面内存中使用。</p>
    <label>控制令牌 <input id="token" type="password" autocomplete="off"></label><br>
    <button id="start" type="button">启动采集</button>
    <button id="stop" type="button">停止采集</button><br>
    <label>采样周期（ms） <input id="period" type="number" min="5000" max="600000" value="5000"></label>
    <button id="set-period" type="button">设置周期</button>
    <h3>告警阈值</h3>
    <select id="threshold-point"></select>
    <select id="threshold-kind"><option value="low">下限</option><option value="high">上限</option><option value="hysteresis">恢复回差</option></select>
    <input id="threshold-value" type="number" step="0.1" value="35" aria-label="阈值">
    <button id="threshold-submit" type="button">保存阈值</button>
    <p class="small">温度使用 ℃，湿度使用 %RH，光照使用 lx。连续三个有效样本确认超限或恢复。</p>
    <div id="message" role="status"></div>
  </section>
  <script>
    const names=['温度','湿度','光照'];
    const units=['℃','%RH','lx'];
    let controlEnabled=false;
    const text=(id,value)=>{document.getElementById(id).textContent=value};
    async function refresh(){
      try{
        const response=await fetch('/api/status',{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        const data=await response.json();
        controlEnabled=data.control_enabled;
        const state=data.field_online?'F407 在线':'F407 离线';
        const el=document.getElementById('connection');
        el.className=data.field_online?'online':'offline';
        el.textContent=state+(data.field_online&&!data.synchronized?' · 正在同步':'')+(data.field_online&&!data.field_storage_ready?' · 本地存储异常，配置保存不可用':'');
        document.getElementById('wifi-panel').hidden=!data.provisioning_ap_active;
        if(data.wifi_connected&&data.wifi_ip){
          text('wifi-message',`已获得 STA 地址 ${data.wifi_ip}。手机接入同一路由器后访问 http://${data.wifi_ip}/。`);
        }
        text('devices',(data.devices||[]).map((s,i)=>`地址 ${i+1}：${['未确认','在线','通信异常','离线','仪表异常'][s]}`).join(' · '));
        text('configuration',`采集：${data.collect_enabled?'运行':'停止'} · 周期：${data.sample_period_ms} ms · 配置版本：${data.config_version} · 启动标识：${data.boot_id}`);
        text('counters',`UART 收字节 ${data.uart_rx_bytes} · 有效帧 ${data.received_frames} · CRC 错误 ${data.crc_errors} · 成帧错误 ${data.framing_errors}`+
          (data.pending_records===undefined?'':` · 待补传 ${data.pending_records} · 累计丢弃 ${data.dropped_records}`)+
          (data.telemetry_sent===undefined?'':` · 已发出 ${data.telemetry_sent} · Broker 已确认 ${data.broker_acked} · MQTT→F407 已执行 ${data.field_applied_commands}`));
        const container=document.getElementById('points');
        container.replaceChildren();
        for(const point of data.points){
          const card=document.createElement('div');card.className='metric';
          const label=document.createElement('div');label.className='label';label.textContent=`区域 ${Math.floor((point.point_id-1)/3)+1} · ${names[(point.point_id-1)%3]}`;
          const value=document.createElement('div');value.className='value';
          value.textContent=point.valid?(((point.point_id-1)%3<2?point.value_scaled/10:point.value_scaled)+' '+units[(point.point_id-1)%3]):'--';
          const quality=document.createElement('div');quality.className='quality '+point.quality;
          quality.textContent=point.quality+' · '+['正常','告警确认中','超限告警','状态未知'][point.alarm_state]+(point.age_ms===undefined?'':` · 样本年龄 ${point.age_ms} ms`);
          const limits=document.createElement('div');limits.className='small';
          const divisor=(point.point_id-1)%3<2?10:1;
          limits.textContent=`范围 ${point.low/divisor}–${point.high/divisor} ${units[(point.point_id-1)%3]} · 回差 ${point.hysteresis/divisor}`;
          card.append(label,value,quality,limits);container.append(card);
        }
        for(const id of ['start','stop','set-period'])document.getElementById(id).disabled=!controlEnabled;
        if(!controlEnabled)text('message','控制接口未配置令牌，当前为只读页面。');
      }catch(error){text('connection','页面无法读取 ESP32 状态：'+error.message)}
    }
    async function command(op){
      if(!controlEnabled)return;
      const token=document.getElementById('token').value;
      if(!token){text('message','请先输入控制令牌。');return}
      const payload={op,request_id:crypto.getRandomValues(new Uint32Array(1))[0]%536870911+1};
      if(['low','high','hysteresis'].includes(op)) {
        payload.point_id=Number(document.getElementById('threshold-point').value);
        const v=Number(document.getElementById('threshold-value').value);
        if(!Number.isFinite(v)){text('message','请输入有效阈值。');return}
        payload.value_scaled=Math.round(v*((payload.point_id-1)%3<2?10:1));
      }
      if(op==='period'){
        const period=Number(document.getElementById('period').value);
        if(!Number.isInteger(period)||period<5000||period>600000){text('message','周期须为 5000–600000 ms。');return}
        payload.period_ms=period;
      }
      text('message','正在等待 F407 回执…');
      try{
        const response=await fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json','X-Gateway-Token':token},body:JSON.stringify(payload)});
        const result=await response.json();
        if(!response.ok)throw new Error(result.error||'HTTP '+response.status);
        const id=result.request_id;
        let done=false;
        for(let n=0;n<60;n++) {
          await new Promise(resolve=>setTimeout(resolve,250));
          const r=await fetch('/api/commands/'+id,{headers:{'X-Gateway-Token':token},cache:'no-store'});
          const s=await r.json(); if(!r.ok)throw new Error(s.error||'命令状态不可用');
          if(s.status==='PENDING')continue;
          if(s.status!=='APPLIED')throw new Error(s.status==='UNCONFIRMED'?'执行结果待核对，请查看当前状态，勿重复提交':'现场拒绝或保存失败');
          text('message',`F407 已保存并确认，配置版本 ${s.config_version}，周期 ${s.sample_period_ms} ms。`);done=true;break;
        }
        if(!done)throw new Error('仍在处理，请稍后查看实际状态');
        await refresh();
      }catch(error){text('message','命令未确认：'+error.message)}
    }
    async function submitWifi(){
      const ssid=document.getElementById('wifi-ssid').value.trim();
      const password=document.getElementById('wifi-password').value;
      if(!ssid){text('wifi-message','请输入路由器 SSID。');return}
      text('wifi-message','正在提交，等待 STA 连接…');
      try{
        const response=await fetch('/api/wifi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ssid,password})});
        const result=await response.json();
        if(!response.ok)throw new Error(result.error||'HTTP '+response.status);
        text('wifi-message','凭据已提交；拿到 IP 后会保存到 NVS。');
      }catch(error){text('wifi-message','配网失败：'+error.message)}
    }
    document.getElementById('start').onclick=()=>command('start');
    document.getElementById('stop').onclick=()=>command('stop');
    document.getElementById('set-period').onclick=()=>command('period');
    document.getElementById('wifi-submit').onclick=submitWifi;
    const options=document.getElementById('threshold-point');
    for(let i=1;i<=9;i++){const o=document.createElement('option');o.value=i;o.textContent=`区域 ${Math.floor((i-1)/3)+1} · ${names[(i-1)%3]}`;options.append(o)}
    document.getElementById('threshold-submit').onclick=()=>command(document.getElementById('threshold-kind').value);
    refresh();setInterval(refresh,2000);
  </script>
</body>
</html>
